version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aerolog
      POSTGRES_USER: aerolog
      POSTGRES_PASSWORD: aerolog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerolog"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aerolog:aerolog@db:5432/aerolog
      VOICE_PROVIDER: local_sim
      ASR_PROVIDER: local_sim
      TTS_PROVIDER: local_sim
      LLM_PROVIDER: rule_based
      ESCALATION_CHANNEL: dashboard
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
