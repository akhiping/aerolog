[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Disable ROS plugins that interfere
addopts = "-p no:ament_copyright -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:ament_xmllint -p no:launch_testing -p no:launch_testing_ros -p no:launch_testing_ros_pytest_entrypoint"
